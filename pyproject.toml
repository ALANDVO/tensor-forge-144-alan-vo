[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-forge-144-alan-vo"
version = "1.0.0"
description = "Jailbreak evaluation framework for LLMs with model-specific prompt management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["ai", "ml", "llm", "jailbreak", "evaluation", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true